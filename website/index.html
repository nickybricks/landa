<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landa — Voice to Text</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div class="logo-island liquid-glass">
    <img src="/icon.png" class="logo-icon" alt="Landa icon">
    <span class="logo-name">Landa</span>
  </div>
  <main>
    <h1 data-hero></h1>
    <p class="subtext" data-i18n="subtext"></p>
<div class="buttons">
      <a href="https://github.com/nickybricks/landa/releases/latest/download/Landa-arm64.dmg" class="btn btn-mac">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
        <span data-i18n="mac"></span>
      </a>
      <a href="https://github.com/nickybricks/landa/releases/latest/download/Landa-x64.exe" class="btn btn-win">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 12V6.75l8-1.25V12H3zm0 .5h8v6.5l-8-1.25V12.5zM11.5 12V5.35l9.5-1.6V12H11.5zm0 .5H21v7.75l-9.5-1.6V12.5z"/></svg>
        <span data-i18n="win"></span>
      </a>
    </div>

    <div class="try-row">
      <button class="try-btn" data-demo-try data-i18n="tryItOut"></button>
    </div>

    <div class="demo-block" data-state="idle-no-mic" hidden>
      <div class="notes-window">
        <div class="notes-toolbar">
          <div class="traffic-lights">
            <span class="tl tl-red"></span>
            <span class="tl tl-yellow"></span>
            <span class="tl tl-green"></span>
          </div>
          <span class="notes-tab">New Note</span>
          <div class="notes-toolbar-icons" aria-hidden="true">
            <span>Aa</span>
            <span>☰</span>
            <span>⊞</span>
            <span>📎</span>
            <span>↗</span>
          </div>
        </div>
        <div class="notes-titlebar">
          <span class="notes-date" data-demo-date></span>
        </div>
        <div class="notes-body">
          <div class="notes-content" contenteditable="true" spellcheck="false" data-demo-content></div>
          <div class="notes-cta" data-demo-cta>
            <p class="shortcut-prompt" data-demo-prompt></p>
            <div class="key-row" data-demo-keys></div>
          </div>
        </div>
      </div>
      <div class="rec-overlay" data-demo-rec hidden>
        <div class="glow glow-bloom"></div>
        <div class="glow glow-flicker"></div>
        <div class="pill">
          <div class="dot"></div>
          <div class="bars" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <div class="spinner" aria-hidden="true"></div>
        </div>
      </div>
    </div>
  </main>
  <footer class="site-footer liquid-glass">
    <p>Made with love from Berlin</p>
  </footer>
  <script src="i18n.js"></script>
  <script src="hero-typer.js"></script>
  <script src="demo.js"></script>
</body>
</html>
