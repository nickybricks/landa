  <script>
    (() => {
      const links = document.querySelectorAll('.apps-nav a');
      const panels = document.querySelectorAll('.app-panel');
      if (!('IntersectionObserver' in window) || !panels.length) return;
      const setActive = (id) => {
        links.forEach((l) => l.classList.toggle('is-active', l.getAttribute('href') === '#' + id));
      };
      const obs = new IntersectionObserver((entries) => {
        const visible = entries
          .filter((e) => e.isIntersecting)
          .sort((a, b) => b.intersectionRatio - a.intersectionRatio);
        if (visible[0]) setActive(visible[0].target.id);
      }, { rootMargin: '-45% 0px -45% 0px', threshold: [0, 0.25, 0.5, 0.75, 1] });
      panels.forEach((p) => obs.observe(p));
      setActive(panels[0].id);
    })();

    (() => {
      const PAUSE_ICON = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      const PLAY_ICON  = '<path d="M8 5v14l11-7z"/>';

      document.querySelectorAll('.video-gif').forEach((wrap) => {
        const video = wrap.querySelector('.app-video');
        const hint  = wrap.querySelector('.gif-pause-hint svg');

        const setIcon = (paused) => {
          hint.innerHTML = paused ? PLAY_ICON : PAUSE_ICON;
          wrap.classList.toggle('is-paused', paused);
        };

        wrap.addEventListener('click', () => {
          video.paused ? video.play() : video.pause();
          setIcon(video.paused);
        });

        const obs = new IntersectionObserver((entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) { video.play(); setIcon(false); }
            else video.pause();
          });
        }, { threshold: 0.3 });
        obs.observe(wrap);
      });
    })();

    (() => {
      const header = document.querySelector('.site-header');
      if (!header) return;
      let ticking = false;
      const onScroll = () => {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(() => {
          header.classList.toggle('is-scrolled', window.scrollY > 24);
          ticking = false;
        });
      };
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
    })();

    (() => {
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const revealEls = document.querySelectorAll('.reveal');
      if (reduce || !('IntersectionObserver' in window)) {
        revealEls.forEach((el) => el.classList.add('is-in'));
        return;
      }
      const ro = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-in');
            ro.unobserve(entry.target);
          }
        });
      }, { rootMargin: '0px 0px -12% 0px', threshold: 0.15 });
      revealEls.forEach((el) => ro.observe(el));
    })();

    (() => {
      const track = document.querySelector('[data-hl-track]');
      const prev = document.querySelector('[data-hl-prev]');
      const next = document.querySelector('[data-hl-next]');
      if (!track || !prev || !next) return;

      const step = () => {
        const card = track.querySelector('.hl-card');
        const gap = parseFloat(getComputedStyle(track).columnGap) || 20;
        return card ? card.offsetWidth + gap : track.clientWidth * 0.8;
      };

      const sync = () => {
        const max = track.scrollWidth - track.clientWidth - 1;
        prev.disabled = track.scrollLeft <= 1;
        next.disabled = track.scrollLeft >= max;
      };

      prev.addEventListener('click', () => track.scrollBy({ left: -step(), behavior: 'smooth' }));
      next.addEventListener('click', () => track.scrollBy({ left: step(), behavior: 'smooth' }));
      track.addEventListener('scroll', () => requestAnimationFrame(sync), { passive: true });
      window.addEventListener('resize', sync);
      sync();
    })();
  </script>
</body>
</html>
